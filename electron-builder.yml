appId: io.github.dofer12.moked
productName: Moked
copyright: Copyright © 2026 dofer12
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
# The icon of the tray is read by Electron itself, so it is a file beside the archive of the app.
extraResources:
  - from: build/tray.png
    to: tray.png
win:
  target:
    - target: nsis
      arch: x64
  artifactName: Moked-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: dofer12
  repo: desshbord-costumer-
